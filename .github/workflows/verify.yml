name: Verify thesis proofs

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: "verify: ${{ matrix.script }} ${{ matrix.args }} [${{ matrix.mode }}]"
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: test_wedge_identities.py
            args: ""
            mode: symbolic
          - script: verify_HK.py
            args: ""
            mode: symbolic
          - script: verify_U.py
            args: ""
            mode: symbolic
          - script: verify_case1.py
            args: ""
            mode: numeric
          - script: verify_case1.py
            args: "--symbolic"
            mode: symbolic
          - script: verify_case2.py
            args: ""
            mode: numeric
          - script: verify_init_prop.py
            args: ""
            mode: numeric
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install sympy

      - name: Run ${{ matrix.script }} ${{ matrix.args }}
        working-directory: verify
        run: python ${{ matrix.script }} ${{ matrix.args }}
